[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/astratomic_game"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.93"
repository = "https://github.com/spicylobstergames/astratomic"
authors = ["Isaac Turci", "The Spicy Lobster Team"]

[workspace.dependencies]
# Internal workspace crates
astratomic_sim = { path = "crates/astratomic_sim" }
astratomic_physics = { path = "crates/astratomic_physics" }
astratomic_render = { path = "crates/astratomic_render" }

# Bones engine
bones_framework = { git = "https://github.com/Zac8668/bones.git", branch = "wgpu" }
bones_lib = { git = "https://github.com/Zac8668/bones.git", branch = "wgpu" }
bones_ecs = { git = "https://github.com/Zac8668/bones.git", branch = "wgpu" }
bones_asset = { git = "https://github.com/Zac8668/bones.git", branch = "wgpu" }
bones_schema = { git = "https://github.com/Zac8668/bones.git", branch = "wgpu" }
bones_wgpu_renderer = { git = "https://github.com/Zac8668/bones.git", branch = "wgpu" }

# Rendering & windowing
wgpu = "24"
winit = "0.30"

# Physics & geometry
rapier2d = { version = "0.22", features = ["parallel", "enhanced-determinism"] }

# Storage, compression, & concurrency
redb = "4.5"
zstd = "0.14"
crossbeam-channel = "0.5.17"
bitcode = "0.6"

# Math, serialization, & utilities
bytemuck = { version = "1.25", features = ["derive", "min_const_generics"] }
glam = "0.24" # Matches bones_framework 0.4
serde = { version = "1.0", features = ["derive"] }
ron = "0.8"
thiserror = "2.0"

# Optimize dependencies even in development
[profile.dev.package."*"]
codegen-units = 1
debug = 1
opt-level = 3

# Optimize workspace crates slightly in development
[profile.dev]
codegen-units = 256
opt-level = 1

[profile.dev-optimized]
inherits = "dev"
debug = 1
opt-level = 3

[profile.release]
codegen-units = 1
lto = true